<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20. Pāra un nepāra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap">
<style>:root{--bg:#F7F8FC;--surface:#FFFFFF;--surface2:#F5F3FF;--line:#E5E7EB;--fg:#374151;--dim:#6B7280;--primary:#4F46E5;--violet:#7C3AED;--cyan:#06B6D4;--amber:#F59E0B;--amber-ink:#B45309;--grad:linear-gradient(135deg,#4F46E5 0%,#7C3AED 50%,#06B6D4 100%);--r-sm:.5rem;--r:1rem;--r-pill:50rem;--sh:0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);--sh-md:0 4px 6px -1px rgba(0,0,0,.10),0 2px 4px -1px rgba(0,0,0,.06);--sh-lg:0 10px 15px -3px rgba(79,70,229,.18);--font:"Inter",Calibri,"Segoe UI",system-ui,sans-serif;--font-h:"Poppins","Inter",Calibri,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
     line-height:1.55}
a{color:inherit;text-decoration:none}

.augsa{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    gap:.6rem;padding:.55rem .8rem;background:var(--grad);color:#fff;
    box-shadow:var(--sh-md)}
.augsa .atpakal{flex:none;padding:.35rem .8rem;border-radius:var(--r-pill);
    background:rgba(255,255,255,.16);font-size:.85rem;font-weight:500;
    transition:background .15s}
.augsa .atpakal:hover{background:rgba(255,255,255,.3)}
.augsa .kods{flex:1;text-align:right;font-size:.78rem;
    color:rgba(255,255,255,.85)}

.lapa{max-width:46rem;margin:0 auto;padding:0 .8rem 3rem}

header.galva{margin:0 -.8rem 1.1rem;padding:1.4rem 1.1rem 1.5rem;
    background:var(--grad);color:#fff;border-radius:0 0 1.5rem 1.5rem;
    position:relative}
/* Valodu pārslēgs (IQ testi) galvas stūrī; izskats - VALODAS_CSS. */
header.galva .valodas{position:absolute;top:.7rem;right:.9rem}
header.galva:has(.valodas) .mikro{padding-right:6rem}
header.galva .mikro{margin:0;font-size:.82rem;color:rgba(255,255,255,.85);
    text-transform:uppercase;letter-spacing:.06em}
header.galva h1{margin:.3rem 0 0;font-family:var(--font-h);font-weight:600;
    line-height:1.2;font-size:clamp(1.45rem,6.4vw,2.1rem)}
header.galva .merkis{margin:.6rem 0 0;font-size:clamp(.95rem,4vw,1.08rem);
    color:rgba(255,255,255,.9)}

.skolotajam{margin:.4rem 0 1rem;border:1px dashed var(--line);
    border-radius:var(--r);background:var(--surface)}
.skolotajam summary{padding:.6rem .9rem;cursor:pointer;color:var(--dim);
    font-size:.85rem;font-weight:500;list-style:none}
.skolotajam summary::-webkit-details-marker{display:none}
.skolotajam summary::before{content:"\25B8  "}
.skolotajam[open] summary::before{content:"\25BE  "}
.skolotajam div{padding:0 .9rem .8rem}
.skolotajam p{margin:.2rem 0;font-size:.85rem;color:var(--dim)}
.skolotajam b{color:var(--fg);font-weight:600}

nav.talak{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.2rem 0 0}
nav.talak a{flex:1 1 12rem;padding:.85rem 1rem;border-radius:var(--r);
    background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--sh);font-size:.95rem;transition:border-color .15s}
nav.talak a:hover{border-color:var(--violet)}
nav.talak a span{display:block;color:var(--dim);font-size:.78rem}
nav.talak a b{color:var(--primary);font-weight:600}

/* Vertikāla daļa un kvadrātsakne - tas pats pieraksts, ko lieto
   prezentācijas (deck_page.py) un darba lapas (fd_page.py); HTML tam nāk no
   mathhtml.py, tāpēc forma ir vienā vietā (DRY). */
.f{display:inline-flex;flex-direction:column;align-items:stretch;
   text-align:center;vertical-align:middle;margin:0 .28em;line-height:1.14}
.f .n{display:block;padding:0 .2em}
.f .d{display:block;padding:0 .2em;border-top:.075em solid currentColor}
.rt{position:relative;display:inline-block;white-space:nowrap;
    --rw:.66em;padding-left:var(--rw);margin:0 .06em}
.rt .rk{position:absolute;left:0;top:0;bottom:0;width:var(--rw);height:auto;
        fill:currentColor}
.rt .rv{display:inline-block;border-top:.075em solid currentColor;
        padding:.16em .2em 0 .06em}
.izcel{color:var(--violet);font-weight:700}
/* Kāpinātājs (a^{m + n}) nepaceļ rindu: bez line-height:0 katra rinda ar
   pakāpi būtu augstāka par blakus rindām. */
sup.pk{font-size:.68em;line-height:0;vertical-align:.62em;margin-left:.04em}

/* Zīmējumi (math_zimejumi.py). Izskats ir lapas, nevis bloka ziņā, jo
   zīmējums var stāvēt gan savā blokā, gan stundas sākumā - un abās vietās
   tam jāizskatās vienādi (DRY). */
svg.zim{display:block;width:100%;height:auto;max-height:52vh;
    overflow:visible}
.zim text{font-family:var(--font);fill:var(--fg)}
.zim .z-ass{stroke:var(--fg);stroke-width:.5;fill:var(--fg)}
.zim .z-iedala{stroke:var(--dim);stroke-width:.4}
.zim .z-punkts{fill:var(--violet)}
.zim .z-stabs{fill:var(--violet);opacity:.85}
.zim .z-kopa{fill:rgba(124,58,237,.10);stroke:var(--violet);stroke-width:.5}
.zim .z-bits{fill:var(--surface);stroke:var(--violet);stroke-width:.5}
.zim .z-bits.on{fill:var(--violet)}
.zim .z-ruts{fill:var(--surface);stroke:var(--violet);stroke-width:.5}
.zim .z-ruts.tuksa{fill:var(--bg);stroke-dasharray:1.8 1.2}
.zim .z-resti{stroke:var(--line);stroke-width:.35}
.zim .z-rame{fill:none;stroke:var(--violet);stroke-width:.7}
.zim .z-lauks{fill:rgba(124,58,237,.28)}
.zim .z-figura{fill:rgba(124,58,237,.16);stroke:var(--violet);
    stroke-width:.7}
.zim .z-lin{fill:none;stroke:var(--violet);stroke-width:.8;
    stroke-linejoin:round}
.zim .z-kerm{fill:none;stroke:var(--primary);stroke-width:.7;
    stroke-linejoin:round}
.zim .z-kerm.slepts{stroke:var(--dim);stroke-dasharray:1.6 1.2}
.zim .z-graf{fill:none;stroke:var(--violet);stroke-width:.9;
    stroke-linecap:round}
.zim .z-graf.otra{stroke:var(--amber-ink);stroke-dasharray:2.4 1.2}
.zim .z-atzime.otra{fill:var(--amber-ink)}
.zim .z-uz{paint-order:stroke;stroke:var(--surface);stroke-width:1.2px}
.zim .z-svitr{stroke:var(--amber-ink);stroke-width:.35}
.zim .z-tukss{fill:var(--surface);stroke:var(--violet);stroke-width:.6}
.zim .z-lin.otra{stroke:var(--amber-ink)}
.zim .z-lin.slepts{stroke:var(--dim);stroke-width:.6;stroke-dasharray:1.6 1.2}
.zim .z-figura.otra{fill:rgba(245,158,11,.20);stroke:var(--amber-ink)}
.zim .z-bulta{fill:none;stroke:var(--amber-ink);stroke-width:.7}
.zim .z-bultgals{fill:var(--amber-ink)}
/* Sektoru diagramma: sešas krāsas pēc kārtas, balta mala atdala sektorus. */
.zim .z-sekt{stroke:var(--surface);stroke-width:.6}
.zim .z-sekt.s0{fill:var(--violet)}
.zim .z-sekt.s1{fill:var(--amber-ink)}
.zim .z-sekt.s2{fill:#0EA5E9}
.zim .z-sekt.s3{fill:#10B981}
.zim .z-sekt.s4{fill:#F472B6}
.zim .z-sekt.s5{fill:#94A3B8}
.zim .z-mazs{font-size:3px;fill:var(--dim)}
.zim .z-dsvitra{stroke:currentColor;stroke-width:.3;stroke:var(--violet)}
.zim .z-nr{font-size:3.4px;fill:var(--fg)}
.zim .z-atzime{font-size:3.6px;font-weight:600;fill:var(--violet)}
.zim .z-virs{font-size:3.8px;font-weight:600;fill:var(--primary)}
.zim .z-bits-c{font-size:4.4px;font-weight:700;fill:var(--violet)}
.zim .z-bits-c.on{fill:#fff}
.zim .z-ruts-c{font-size:5px;font-weight:700;fill:var(--violet)}
.zim .z-ruts-c.tuksa{fill:var(--dim);font-weight:600}
.vv{position:relative;white-space:nowrap}
.vv::after{content:"";position:absolute;left:-.04em;right:-.04em;top:-.52em;
    height:.42em;border-top:.075em solid currentColor;
    border-right:.075em solid currentColor;
    transform:skewX(58deg) scaleY(.5);transform-origin:right top}

/* 1.-2. klases zīmējumi (math_bildes.py). */
.zim .z-ik .l{fill:none;stroke:var(--violet);stroke-width:3.4;
    stroke-linecap:round;stroke-linejoin:round}
.zim .z-ik .p{fill:var(--violet);stroke:none}
.zim .z-ik.otra .l{stroke:var(--amber-ink)}
.zim .z-ik.otra .p{fill:var(--amber-ink)}
.zim .z-ripa{fill:var(--violet)}
.zim .z-ripa.otra{fill:var(--amber-ink)}
.zim .z-ruts.on{fill:rgba(124,58,237,.22)}
.zim .z-ruts.siena{fill:var(--dim)}
.zim .z-kf{fill:#DDD6FE;stroke:var(--primary);stroke-width:.4}
.zim .z-kt{fill:#EDE9FE;stroke:var(--primary);stroke-width:.4}
.zim .z-ks{fill:#C4B5FD;stroke:var(--primary);stroke-width:.4}
.zim .z-ruts.dz{fill:rgba(245,158,11,.30);stroke:var(--amber-ink)}
.zim .z-cels{fill:none;stroke:var(--amber-ink);stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round}
.zim .z-ciparnica{fill:var(--surface);stroke:var(--violet);stroke-width:1}
.zim .z-cipars{font-size:4.4px;font-weight:600;fill:var(--fg)}
.zim .z-rad{stroke:var(--primary);stroke-width:1.8;stroke-linecap:round}
.zim .z-rad.min{stroke:var(--violet);stroke-width:1}
.zim .z-nauda{fill:#FDE68A;stroke:var(--amber-ink);stroke-width:.5}
.zim .z-nauda.banknote{fill:#DDD6FE;stroke:var(--violet)}
.zim .z-kubs{fill:rgba(124,58,237,.22);stroke:var(--violet);stroke-width:.35}
.zim .z-kubs.viens{fill:rgba(245,158,11,.30);stroke:var(--amber-ink)}
.zim .z-simts{font-size:3.4px;font-weight:600;fill:var(--fg)}
.zim .z-simts.tuksa{fill:var(--dim)}
.zim .z-lineals{fill:#FEF3C7;stroke:var(--amber-ink);stroke-width:.4}

.ik{display:inline-block;width:1em;height:1em;vertical-align:-.13em;
    line-height:0}
.ik svg{width:100%;height:100%;display:block;overflow:visible}
.ik .l{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;
    stroke-linejoin:round}
.ik .p{fill:currentColor;stroke:none}

@media (min-width:768px){
  .lapa{padding:0 1.4rem 4rem}
  header.galva{margin:0 -1.4rem 1.4rem;padding:2rem 1.6rem 2.1rem}
  .bl{padding:1.4rem 1.4rem 1.5rem}
}

.valodas{display:flex;gap:2px;padding:2px;border-radius:var(--r-pill);
         background:rgba(255,255,255,.16)}
.valodas a,.valodas span{padding:.22rem .7rem;border-radius:var(--r-pill);
         font-size:.8rem;font-weight:600;letter-spacing:.04em;color:#fff}
.valodas a:hover{background:rgba(255,255,255,.22)}
.valodas .on{background:#fff;color:var(--primary)}

.bl{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);
    padding:1.1rem 1rem 1.2rem;margin:0 0 1rem}
.bl>h2{margin:0 0 .5rem;font-family:var(--font-h);font-weight:600;
    color:var(--primary);font-size:clamp(1.05rem,4.6vw,1.3rem)}
.bl p{margin:.45rem 0;font-size:clamp(1rem,4.2vw,1.12rem)}
.bl .punkti{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.5rem}
.bl .punkti li{position:relative;padding:.55rem .7rem .55rem 2.2rem;
    background:var(--bg);border-radius:var(--r-sm);
    font-size:clamp(.98rem,4vw,1.08rem)}
.bl .punkti li::before{content:"";position:absolute;left:.85rem;top:1.05em;
    width:.5rem;height:.5rem;margin-top:-.25rem;border-radius:50%;
    background:var(--cyan)}
.bl .zime{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;
    margin:.8rem 0 .2rem;color:var(--violet)}
.bl .zime .ik{font-size:2.8rem}

.speles{margin:.7rem 0 0}
.speles .virsa{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;
    padding:.6rem .8rem;border-radius:var(--r);background:var(--surface2)}
.speles .kart{flex:none;padding:.15rem .6rem;border-radius:var(--r-pill);
    background:var(--surface);color:var(--primary);font-weight:600;
    font-size:.82rem}
.speles .jaut{flex:1 1 12rem;margin:0;color:var(--primary);font-weight:600;
    font-size:clamp(1rem,4.3vw,1.15rem)}
.speles .laukums{margin:.7rem 0}
.speles .kzim{margin:0 0 .6rem}
/* Atbildes rinda ar lodziņu - to lieto gan Ievadi, gan Kustiba, tāpēc tā ir
   dzinējā, nevis vienā uzdevuma veidā (DRY). */
.speles .ie-rinda{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;
    margin:.8rem 0 0}
.speles .ie-rinda input{flex:1 1 8rem;min-width:7rem;font:inherit;
    padding:.7rem .9rem;min-height:2.9rem;border-radius:var(--r);
    border:2px solid var(--line);background:var(--surface);color:var(--fg);
    font-size:clamp(1rem,4.3vw,1.15rem)}
.speles .ie-rinda input:focus{outline:0;border-color:var(--violet)}
.speles .ie-rinda input.labi{border-color:#047857;background:#DCFCE7}
.speles .ie-rinda input.nepareizi{border-color:#FCA5A5;background:#FEF2F2}
.speles .vadiba{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0 0}
.speles .atb{margin:.6rem 0 0;min-height:1.5rem;font-weight:600;
    font-size:clamp(.98rem,4vw,1.08rem)}
.speles .atb.labi{color:#047857}
.speles .atb.vel{color:var(--amber-ink)}
.speles .gals{margin:.2rem 0;color:#047857;font-weight:600}

.speles button{font:inherit;cursor:pointer;border-radius:var(--r-pill);
    border:1px solid var(--line);background:var(--surface);color:var(--fg);
    padding:.7rem 1.1rem;min-height:2.9rem;font-weight:500;
    font-size:clamp(.95rem,4vw,1.05rem);transition:background .15s}
.speles button:hover{background:var(--surface2)}
.speles button:disabled{opacity:.4;cursor:default}
.speles button:disabled:hover{background:var(--surface)}
.speles button.galvena,.speles button.talak{background:var(--primary);
    border-color:var(--primary);color:#fff}
.speles button.galvena:hover,.speles button.talak:hover{
    background:var(--violet);border-color:var(--violet)}

.speles .mantas{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.speles .manta{position:relative;display:inline-flex;align-items:center;
    justify-content:center;width:4rem;height:4rem;padding:0;
    border-radius:var(--r);border:2px solid var(--line);
    background:var(--surface);color:var(--primary)}
.speles .manta .ik{font-size:2.4rem}
.speles .manta.ok{background:#DCFCE7;border-color:#047857;color:#047857}
.speles .manta .nr{position:absolute;right:.15rem;top:.05rem;
    font-style:normal;font-weight:700;font-size:.85rem;color:#047857}
.speles .manta.klusi{cursor:default}

/* Laika vērtējums (MSP.tempo): cik ātri atrisināts pret mērķa laiku. */
.speles .tempo{margin:.6rem 0 0;padding:.6rem .8rem .5rem;
    border-radius:var(--r);background:var(--surface2);animation:tempo-in .35s}
.speles .tempo-r{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap}
.speles .tempo-r b{font-family:var(--font-h);font-weight:600;
    font-size:clamp(1.25rem,5.5vw,1.5rem);color:var(--primary)}
.speles .tempo-r span{font-weight:600;font-size:clamp(.92rem,3.8vw,1.02rem)}
.speles .tempo-j{position:relative;height:.5rem;margin:.45rem 0 1.1rem;
    border-radius:1rem;background:#fff}
.speles .tempo-j i{position:absolute;left:0;top:0;bottom:0;border-radius:1rem;
    background:var(--violet);animation:tempo-aug .8s ease-out}
.speles .tempo-j em{position:absolute;left:50%;top:-.25rem;bottom:-.25rem;
    width:2px;background:var(--fg)}
.speles .tempo-j small{position:absolute;left:50%;top:.75rem;
    transform:translateX(-50%);white-space:nowrap;color:var(--dim);
    font-size:.75rem}
.speles .tempo.zibens{background:linear-gradient(135deg,#EDE9FE,#CFFAFE)}
.speles .tempo.zibens .tempo-r span{color:var(--violet)}
.speles .tempo.atri{background:#DCFCE7}
.speles .tempo.atri .tempo-r span{color:#047857}
.speles .tempo.atri .tempo-j i{background:#10B981}
.speles .tempo.labi{background:#E0F2FE}
.speles .tempo.labi .tempo-r span{color:#0369A1}
.speles .tempo.labi .tempo-j i{background:#0EA5E9}
.speles .tempo.treni{background:#FEF3C7}
.speles .tempo.treni .tempo-r span{color:var(--amber-ink)}
.speles .tempo.treni .tempo-j i{background:var(--amber)}
@keyframes tempo-aug{from{width:0}}
@keyframes tempo-in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){
  .speles .tempo,.speles .tempo-j i{animation:none}
}

/* ---- Skatuve: visa spēle ir tieši viena ekrāna augstumā ----
   Bloks nekad nav garāks par ekrānu, tāpēc tajā nav jāritina: augstums ir
   --iq-h, un zīmējums aizņem to, kas paliek pāri virsrakstam un atbildēm.
   Zīmējumu izmērus rēķina no konteinera (cqw/cqh), nevis no ekrāna, tāpēc
   viens un tas pats CSS der telefonam, datoram un pilnekrānam. */
:root{--iq-h:min(calc(100svh - 5.5rem),52rem)}
body.pilns{--iq-h:calc(100svh - 5.8rem);--gals:"Tests galā"}
body{--gals:"Tests galā"}
html[lang="en"] body{--gals:"Test complete"}
body.pilns .bl.iq{padding-top:1rem;padding-bottom:4.8rem;
    justify-content:flex-start}
.bl.iq{position:relative;overflow:hidden;padding-top:.9rem}
.speles[data-veids="iq"]{height:var(--iq-lapa,var(--iq-h));margin:0;
    display:flex;flex-direction:column;container-type:size}
body.pilns .speles[data-veids="iq"]{height:var(--iq-h)}
/* Garajā lapā galva ir šaura, lai spēle ietilptu zem tās tajā pašā
   ekrānā; cik vietas palika, izmēra JS (--iq-lapa). */
body:not(.pilns) .lapa:has(.bl.iq) header.galva{margin-bottom:.8rem;
    padding:.8rem 1.1rem .9rem}
body:not(.pilns) .lapa:has(.bl.iq) header.galva h1{
    font-size:clamp(1.2rem,5vw,1.55rem)}
body:not(.pilns) .lapa:has(.bl.iq) header.galva .merkis{margin-top:.15rem;
    font-size:.9rem}

.iq-hud{flex:none;display:flex;flex-direction:column;gap:.45rem;
    margin:0 0 .6rem}
.iq-prog{display:flex;gap:3px}
.iq-prog span{flex:1;height:.5rem;border-radius:1rem;background:var(--line);
    transition:background .3s}
.iq-prog span.tagad{background:#C4B5FD;animation:iq-puls 1.2s infinite}
.iq-prog span.ja{background:#10B981}
.iq-prog span.velak{background:var(--amber)}
.iq-prog span.izlaists{background:#F87171}
.iq-stat{display:flex;gap:.45rem;flex-wrap:wrap}
.iq-pill{display:inline-flex;align-items:center;gap:.3rem;
    padding:.2rem .7rem;border-radius:var(--r-pill);background:var(--bg);
    font-weight:600;font-size:.9rem;color:var(--fg)}
.iq-pill svg{width:1.05rem;height:1.05rem;fill:currentColor}
.iq-pill.zv{color:#B45309;background:#FEF3C7}
.iq-pill.ug{color:var(--dim)}
.iq-pill.ug.karsts{color:#DC2626;background:#FEE2E2;
    animation:iq-hop .5s}
.iq-pill.lk{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.iq-pill.hop{animation:iq-hop .5s}

.iq-kart{flex:1 1 0;min-height:0;display:flex;flex-direction:column;
    position:relative}
.iq-kart.iq-in{animation:iq-in .35s ease-out}
.iq-nr{flex:none;margin:0;color:var(--violet);font-weight:600;
    font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.iq-jaut{flex:none;margin:.15rem 0 .5rem;color:var(--primary);
    font-family:var(--font-h);font-weight:600;line-height:1.28;

      c.izl=poga("iq-izlaist",T.izlaist);
      c.izl.addEventListener("click",function(){izlaist(c);});
      c.vad.appendChild(c.izl);
    }
    saki(c,teksts||T.vel_ne,false);
    c.lauks.classList.remove("krata");void c.lauks.offsetWidth;
    c.lauks.classList.add("krata");
  }

  function radi(){
    var k=visas[st.i];
    st.kluda=false;st.gatavs=false;
    josla();atjauno();
    kart.innerHTML="";kart.className="iq-kart";void kart.offsetWidth;
    kart.className="iq-kart iq-in";
    var jaut=e("p","iq-jaut");jaut.innerHTML=k.jaut;
    var c={k:k,kart:kart,lauks:e("div","iq-lauks"),zin:e("p","iq-zin"),
           vad:e("div","iq-vad")};
    c.labi=function(){atrisinats(c);};
    c.ne=function(t){kluda(c,t);};
    kart.appendChild(e("p","iq-nr",f(T.nr,{i:st.i+1,n:visas.length})));
    var vieta=e("div","iq-vieta");vieta.appendChild(c.lauks);
    kart.appendChild(jaut);kart.appendChild(vieta);
    kart.appendChild(c.zin);kart.appendChild(c.vad);
    /* Laiku skaita no brīža, kad var atbildēt - iegaumēšana neskaitās. */
    function jautat(){c.t0=Date.now();VEIDI[k.veids](c);}
    if(k.radit){atcereties(c,jautat);}else{jautat();}
  }

  function beigas(){
    clearInterval(taimeris);
    st.beigas=true;josla();
    var n=visas.length,p=st.punkti,d=p/n;
    var zv=d>=0.9?3:d>=0.7?2:d>=0.4?1:0;
    var bija=-1;
    try{
      bija=parseInt(localStorage.getItem("iq:"+id)||"-1",10);
      if(p>bija){localStorage.setItem("iq:"+id,""+p);}
    }catch(x){}
    kart.innerHTML="";kart.className="iq-kart iq-in iq-beigas";
    var L=2*Math.PI*52;
    var r=e("div","iq-rinkis");
    r.innerHTML='<svg viewBox="0 0 120 120"><defs><linearGradient '+
      'id="iq-grad"><stop offset="0" stop-color="#4F46E5"/><stop '+
      'offset="1" stop-color="#06B6D4"/></linearGradient></defs>'+
      '<circle class="fons" cx="60" cy="60" r="52"/><circle class="vert" '+
      'cx="60" cy="60" r="52" stroke-dasharray="'+L+'" '+
      'stroke-dashoffset="'+L+'"/></svg><b></b>';
    r.lastChild.textContent=p+"/"+n;
    kart.appendChild(r);
    setTimeout(function(){r.querySelector(".vert")
      .setAttribute("stroke-dashoffset",""+L*(1-d));},60);
    var zvs=e("div","iq-zvaigznes");
    for(var i=0;i<3;i++){
      var s=e("span");s.innerHTML=IK.zv;
      if(i<zv){s.firstChild.setAttribute("class","on");
        s.firstChild.style.animationDelay=(0.5+i*0.25)+"s";}
      zvs.appendChild(s);
    }
    kart.appendChild(zvs);
    kart.appendChild(e("h3","",T.virsraksti[zv]));
    kart.appendChild(e("p","",f(T.rezultats,{p:p,n:n})));
    var ch=e("div","iq-stat"),a=e("span","iq-pill lk"),
        b=e("span","iq-pill ug"),c=e("span","iq-pill zv");
    pill(a,"lk",laiks(Date.now()-st.sak));
    pill(b,"ug",f(T.labaka,{n:st.labaka}));
    ch.appendChild(a);ch.appendChild(b);
    var d_=e("span","iq-pill lk");
    pill(d_,"lk",f(T.atri,{a:st.atri,n:n}));
    ch.appendChild(d_);
    if(bija>=0){
      pill(c,"zv",p>bija?T.jauns:f(T.rekords,{b:bija,n:n}));
      ch.appendChild(c);
    }
    kart.appendChild(ch);
    var vad=e("div","iq-vad"),no=poga("galvena iq-atkal",T.atkal);
    no.addEventListener("click",function(){sakt();redzams();});
    vad.appendChild(no);kart.appendChild(vad);
    if(zv>=2){setTimeout(function(){konfeti(60);},400);}
    zinot("iq_finish",{score:p,total:n,stars:zv,best_streak:st.labaka,
                       seconds:Math.round((Date.now()-st.sak)/1000)});
  }

  /* Garajā lapā spēle aizņem tieši to, kas ekrānā palicis zem galvas.
     Ja tas ir par maz (ļoti zems ekrāns), paliek CSS augstums - viss ekrāns,
     un lapu vienreiz pabīda līdz spēlei. Lentē augstumu dod CSS. */
  var MIN_H=440;
  function izmers(){
    if(document.body.classList.contains("pilns")){return;}
    var bl=root.closest(".bl")||root;
    var apaksa=parseFloat(getComputedStyle(bl).paddingBottom)||0;
    var h=window.innerHeight-(root.getBoundingClientRect().top+
          window.pageYOffset)-apaksa-8;
    if(h>=MIN_H){root.style.setProperty("--iq-lapa",Math.floor(h)+"px");}
    else{root.style.removeProperty("--iq-lapa");}
  }
  izmers();
  window.addEventListener("resize",izmers);
  if(window.MutationObserver){
    new MutationObserver(izmers).observe(document.body,
      {attributes:true,attributeFilter:["class"]});
  }

  function sakt(){
    st={i:0,punkti:0,serija:0,labaka:0,atri:0,sak:Date.now(),rez:[]};
    zinot("iq_start",{total:visas.length});
    clearInterval(taimeris);
    taimeris=setInterval(function(){pill(pLk,"lk",
      laiks(Date.now()-st.sak));},1000);
    radi();
  }
  if(visas.length){sakt();}
};

(function(){
  /* Katrai daļai viens uzdevums: ekrāns (fullscreen API), stāvoklis (kura
     daļa ir priekšā) un attēlošana. Pogas un taustiņi sauc tos pašus
     darbus - atver, aizver, ej. */
  var lapa=document.querySelector(".lapa");
  var dalas=[].slice.call(
    document.querySelectorAll("header.galva,.saturs>.bl,.lapa>nav.talak"));
  if(!lapa||dalas.length<2){return;}
  var cur=0,on=false;

  /* Pogu uzraksti pēc <html lang> - angliski ir IQ testi (valoda.py). */
  var V=document.documentElement.lang==="en"?
    {visa:"Full page",skirstit:"Swipe",pilns:"Fullscreen",
     velc:"Swipe sideways →"}:
    {visa:"Visa lapa",skirstit:"Šķirstīt",pilns:"Pilnekrāns",
     velc:"Velc uz sāniem →"};

  function e(tag,cls,txt){var n=document.createElement(tag);
    if(cls){n.className=cls;}if(txt!=null){n.textContent=txt;}return n;}
  function poga(cls,txt,zime){var b=e("button",cls,txt);b.type="button";
    b.addEventListener("click",zime);return b;}

  /* Telefons ir citāds tikai divās lietās: lente tur atveras pati, un
     pilnekrāna režīmu no pārlūka neprasa (to atļauj tikai pēc pieskāriena
     - un lentei tas nav vajadzīgs). */
  var telefons=!!(window.matchMedia&&
                  window.matchMedia("(max-width:767px)").matches);
  /* Spēles lapa (IQ): telefonā vienmēr lente, uzreiz spēle, pilnekrāns. */
  var spele=document.body.getAttribute("data-lente")==="spele";
  var IKONA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 '+
    '9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" '+
    'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function atceras(k,v){try{localStorage.setItem(k,v);}catch(x){}}
  function atminas(k){try{return localStorage.getItem(k);}
    catch(x){return null;}}
  var SKATS="math-lente",MAJIENS="math-lente-majiens",TURPINA="math-lente-turpina";
  function atceras1(k,v){try{sessionStorage.setItem(k,v);}catch(x){}}
  function atminas1(k){try{var v=sessionStorage.getItem(k);
    sessionStorage.removeItem(k);return v;}catch(x){return null;}}

  /* --- josla lejā un poga augšā --- */
  var skaits=e("span","cnt","");
  var progress=e("div","pilnprog");
  document.body.appendChild(progress);
  var josla=e("div","pilnjosla");
  josla.appendChild(poga("nav","‹",function(){ej(cur-1);}));
  josla.appendChild(skaits);
  josla.appendChild(poga("nav","›",function(){ej(cur+1);}));
  josla.appendChild(poga("",telefons?V.visa:"Esc",aizvert));
  document.body.appendChild(josla);

  var augsa=document.querySelector(".augsa");
  var pilnpoga=poga("pilnpoga"+(spele?" izcelta":""),"",function(){
    atvert(!telefons||spele);
  });
  pilnpoga.innerHTML=IKONA+"<span></span>";
  pilnpoga.lastChild.textContent=telefons&&!spele?V.skirstit:V.pilns;
  if(augsa){augsa.appendChild(pilnpoga);}

  /* --- ekrāns --- */
  var sakne=document.documentElement;
  function ekrana(){return document.fullscreenElement||
                           document.webkitFullscreenElement;}
  function prasit(){
    var f=sakne.requestFullscreen||sakne.webkitRequestFullscreen;
    if(f){try{var p=f.call(sakne);if(p&&p["catch"]){p["catch"](
      function(){});}}catch(x){}}
  }
  function atlaist(){
    var f=document.exitFullscreen||document.webkitExitFullscreen;
    if(ekrana()&&f){try{var p=f.call(document);
      if(p&&p["catch"]){p["catch"](function(){});}}catch(x){}}
  }

  /* --- stāvoklis --- */
  function zimet(){
    skaits.textContent=(cur+1)+" / "+dalas.length;
    progress.style.width=((cur+1)/dalas.length*100)+"%";
  }
  function ej(i){
    cur=i<0?0:(i>=dalas.length?dalas.length-1:i);
    lapa.scrollTo({left:cur*lapa.clientWidth,behavior:"smooth"});
    zimet();
  }
  function atvert(arEkranu){
    on=true;document.body.classList.add("pilns");
    if(arEkranu){prasit();}
    if(telefons&&!spele){atceras(SKATS,"1");}
    /* Lente rodas tikai tagad, tāpēc vieta jāieņem pēc pārzīmēšanas. */
    setTimeout(function(){lapa.scrollLeft=cur*lapa.clientWidth;zimet();},0);
  }
  function aizvert(){
    on=false;document.body.classList.remove("pilns");atlaist();
    if(telefons&&!spele){atceras(SKATS,"0");}
    if(dalas[cur]){dalas[cur].scrollIntoView({block:"start"});}
  }

  /* Pārlūks pilnekrānu atļauj tikai pēc cilvēka darbības, tāpēc to paprasa
     pie pirmā pieskāriena vai taustiņa - ne agrāk. */
  function pecPieskariena(){
    var vienreiz=function(ev){
      if(ev.key==="Escape"){return;}
      document.removeEventListener("keydown",vienreiz,true);
      document.removeEventListener("pointerdown",vienreiz,true);
      if(on&&!ekrana()){prasit();}
    };
    document.addEventListener("keydown",vienreiz,true);
    document.addEventListener("pointerdown",vienreiz,true);
  }

  /* Telefonā lente ir noklusējums - bet tikai tik ilgi, kamēr students nav
     izvēlējies garo lapu. Spēlē lente ir vienmēr, un tā sākas ar spēli. */
  if(spele&&telefons){
    cur=Math.min(1,dalas.length-1);
    atvert(false);
    pecPieskariena();
  }else if(telefons&&atminas(SKATS)!=="0"){
    atvert(false);
    if(atminas(MAJIENS)!=="1"){
      document.body.appendChild(e("div","pilnmajiens",
                                  V.velc));
      atceras(MAJIENS,"1");
    }
  }

  /* Datorā uz nākamo stundu no pilnekrāna: tā atveras lentē, un pilnekrānu
     paprasa pie pirmā cilvēka pieskāriena - bez tā pārlūks atsaka. */
  [].slice.call(document.querySelectorAll("nav.talak a")).forEach(function(a){
    a.addEventListener("click",function(){if(on&&!telefons){
      atceras1(TURPINA,"1");}});
  });
  if(!telefons&&atminas1(TURPINA)==="1"){
    atvert(false);
    pecPieskariena();
  }

  /* Pagriežot telefonu, lentes solis kļūst cits, tāpēc tā pati daļa
     jāpabīda no jauna zem malas. */
  window.addEventListener("resize",function(){
    if(on&&lapa.clientWidth){lapa.scrollLeft=cur*lapa.clientWidth;}
  });

  /* Ar pirkstu šķirot, kārtas numuru nolasa no lentes, nevis glabā
     atsevišķi - tā skaitītājs vienmēr runā par to, ko cilvēks redz.
     Nolasa tikai tad, kad lente apstājusies: citādi ar pogu sāktais
     slīdiens pa ceļam pārrakstītu tikko izvēlēto numuru. */
  var miers=null;
  lapa.addEventListener("scroll",function(){
    if(!on||!lapa.clientWidth){return;}
    if(miers){clearTimeout(miers);}
    miers=setTimeout(function(){
      var i=Math.round(lapa.scrollLeft/lapa.clientWidth);
      if(i!==cur&&i>=0&&i<dalas.length){cur=i;zimet();}
    },140);
  });

  /* Kamēr cilvēks raksta atbildi, taustiņi pieder laukam, nevis lentei:
     jauktā daļskaitlī «3 2/5» atstarpe ir daļa no atbildes. */
  function raksta(el){
    if(!el){return false;}
    if(el.isContentEditable){return true;}
    var t=(el.tagName||"").toUpperCase();
    return t==="INPUT"||t==="TEXTAREA"||t==="SELECT";
  }
  document.addEventListener("keydown",function(ev){
    if(!on||raksta(ev.target)){return;}
    var k=ev.key;
    if(k==="ArrowRight"||k===" "||k==="PageDown"){ej(cur+1);}
    else if(k==="ArrowLeft"||k==="PageUp"){ej(cur-1);}
    else if(k==="Home"){ej(0);}
    else if(k==="End"){ej(dalas.length-1);}
    else if(k==="Escape"){aizvert();}
    else{return;}
    ev.preventDefault();
  });
  /* Esc pilnekrānā pārtver pārlūks - tad jāsakārto pašiem. */
  function saskanot(){if(on&&!ekrana()){aizvert();}}
  document.addEventListener("fullscreenchange",saskanot);
  document.addEventListener("webkitfullscreenchange",saskanot);

  zimet();
})();
</script>
