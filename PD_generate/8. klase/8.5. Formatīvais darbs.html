<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formatīvais darbs Nr. 5. Kas kopīgs četrstūriem, kuru pretējās malas ir pa pāriem paralēlas?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap">
<style>:root{--bg:#F7F8FC;--surface:#FFFFFF;--surface2:#F5F3FF;--line:#E5E7EB;--fg:#374151;--dim:#6B7280;--primary:#4F46E5;--violet:#7C3AED;--cyan:#06B6D4;--amber:#F59E0B;--amber-ink:#B45309;--grad:linear-gradient(135deg,#4F46E5 0%,#7C3AED 50%,#06B6D4 100%);--r-sm:.5rem;--r:1rem;--r-pill:50rem;--sh:0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);--sh-md:0 4px 6px -1px rgba(0,0,0,.10),0 2px 4px -1px rgba(0,0,0,.06);--sh-lg:0 10px 15px -3px rgba(79,70,229,.18);--font:"Inter",Calibri,"Segoe UI",system-ui,sans-serif;--font-h:"Poppins","Inter",Calibri,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
     line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}

.top{position:sticky;top:0;z-index:20;display:flex;gap:.6rem;
     align-items:center;flex-wrap:wrap;padding:.6rem .9rem;
     background:var(--grad);color:#fff;box-shadow:var(--sh-md)}
.top b{font-size:1rem;font-weight:600;font-family:var(--font-h)}
.top .sub{font-size:.78rem;color:rgba(255,255,255,.82);flex:1 1 10rem}
sub{font-size:.62em;vertical-align:-.22em;line-height:0}
.top .back{font-size:.82rem;padding:.35rem .75rem;border-radius:var(--r-pill);
     background:rgba(255,255,255,.14);transition:background .15s}
.top .back:hover{background:rgba(255,255,255,.28)}

.tools{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;
     max-width:52rem;margin:1rem auto 0;padding:0 1rem}
.tools button{font:inherit;font-size:.88rem;font-weight:500;border:0;
     cursor:pointer;border-radius:var(--r-pill);padding:.55rem 1.1rem;
     background:var(--surface);color:var(--primary);box-shadow:var(--sh);
     transition:transform .15s,box-shadow .15s,background .15s}
.tools button:hover{transform:translateY(-1px);box-shadow:var(--sh-lg)}
.tools button.main{background:var(--primary);color:#fff}
.tools button.main:hover{background:var(--violet)}
.tools button[aria-pressed="true"]{background:var(--amber-ink);color:#fff}
.tools .kods{margin-left:auto;font-size:.8rem;color:var(--dim);
     font-variant-numeric:tabular-nums}
.tools .kods b{color:var(--primary);font-size:.95rem;letter-spacing:.08em}

/* ---------- lapa ---------- */
.sheet{max-width:52rem;margin:1rem auto 3rem;background:var(--surface);
     border-radius:var(--r);box-shadow:var(--sh-md);padding:2rem 2.2rem 2.4rem;
     color:#1A1A1A}
/* Gara punktu virkne ("......") ir viens vārds - bez šī tā izstieptu lapu. */
.sheet p{overflow-wrap:break-word}
.sheet .meta{margin:0 0 .1rem;font-size:.78rem;color:var(--dim)}
.sheet .ph1{margin:0 0 .1rem;font-family:var(--font-h);font-weight:600;
     color:var(--primary);font-size:clamp(1.15rem,4.4vw,1.5rem)}
.sheet .ph2{margin:0 0 .5rem;font-weight:600;color:var(--primary);
     font-size:clamp(.92rem,3.6vw,1.05rem)}
.sheet .pnote{margin:.2rem 0 .6rem;font-size:.82rem;font-style:italic;
     color:var(--dim)}
.sheet .psec{margin:1.1rem 0 .3rem;font-weight:600;color:var(--primary);
     font-size:.95rem}
.sheet .pfoot{margin:.9rem 0 0;font-size:.85rem;color:var(--dim)}

.form{display:flex;gap:.8rem;flex-wrap:wrap;margin:.6rem 0 .9rem}
.form>div{flex:1 1 8rem}
.form .line{display:block;border-bottom:1px dotted #9CA3AF;height:1.25rem}
.form .lbl{font-size:.72rem;color:var(--dim)}

.box{border:1px solid var(--line);border-left:4px solid var(--violet);
     border-radius:.6rem;background:var(--surface2);padding:.6rem .8rem;
     margin:.7rem 0 1rem}
/* ATGĀDNE nāk no tā paša teksta, ko Word fails, tāpēc platās atstarpes
   starp formulām jāpatur - citādi tās saplūst vienā rindā. */
.box p{margin:0;font-size:.85rem;white-space:pre-wrap}
.box .boxt{font-weight:600;color:var(--primary);font-size:.75rem;
     letter-spacing:.06em}

/* Vertikāla daļa (a/b) - tā pati, ko lieto prezentācijas (deck_page.py). */
.f{display:inline-flex;flex-direction:column;align-items:stretch;
   text-align:center;vertical-align:middle;margin:0 .28em;line-height:1.14}
.f .n{display:block;padding:0 .2em}
.f .d{display:block;padding:0 .2em;border-top:.075em solid currentColor}

/* Kvadrātsakne: vinkuls pāri VISAI izteiksmei (rules_pd.txt). Zīme ir
   zīmēta (SVG), nevis ņemta no fonta, tāpēc vinkuls turpinās tieši no tās
   augšējā stūra - tāpat kā prezentācijās (deck_page.py). */
.rt{position:relative;display:inline-block;white-space:nowrap;
    --rw:.66em;padding-left:var(--rw);margin:0 .06em}
.rt .rk{position:absolute;left:0;top:0;bottom:0;width:var(--rw);height:auto;
        fill:currentColor}
.rt .rv{display:inline-block;border-top:.075em solid currentColor;
        padding:.16em .2em 0 .06em}

.q{margin:.7rem 0 .9rem}
.q .qt{margin:0 0 .25rem;font-size:.95rem}
.q .opts{display:grid;gap:.25rem .9rem;grid-template-columns:1fr 1fr;
     padding-left:.9rem}
.q .opt{font-size:.9rem;padding:.1rem .35rem;border-radius:.4rem}
.q .opt b{color:var(--dim);font-weight:600}
.sheet.key .opt.ok{background:#DCFCE7;color:#065F46;font-weight:500}
.sheet.key .opt.ok b{color:#047857}

.tw{overflow-x:auto;margin:.4rem 0 .2rem}
table.grid,table.tbl{border-collapse:collapse;width:100%;table-layout:fixed}
table.tbl{margin:.4rem 0 .2rem}
table.grid th,table.tbl th,table.grid td,table.tbl td{
     border:1px solid #A6A6A6;padding:.3rem .4rem;font-size:.85rem;
     text-align:left;vertical-align:middle}
table.grid th,table.tbl th{background:#1F3864;color:#fff;font-weight:600;
     text-align:center;font-size:.8rem}
table.tbl th{text-align:left}
table.grid td{height:1.8rem;text-align:center;letter-spacing:.28em}
table.grid th.tuksa{background:transparent;border:0}
table.grid .ans{display:none;font-weight:700;letter-spacing:0;
     color:#047857}
.sheet.key table.grid .abcd{display:none}
.sheet.key table.grid .ans{display:inline}

.keys{display:none;margin:.2rem 0}
.keys p{margin:0;font-size:.88rem}
.keys span{color:var(--dim)}
.sheet.key .keys{display:block}

/* ---------- telefons ---------- */
@media (max-width:768px){
  .sheet{margin:.7rem .6rem 2rem;padding:1.1rem 1rem 1.4rem;
         border-radius:.9rem}
  .tools{padding:0 .6rem}
  .tools button{flex:1 1 auto;font-size:.82rem;padding:.55rem .8rem}
  .tools .kods{flex:1 1 100%;margin-left:0;text-align:right}
  .q .opts{grid-template-columns:1fr;padding-left:.5rem}
  .top b{flex:1 1 100%;order:2;font-size:.92rem}
  .top .back{order:1}
  .top .sub{order:3}
  table.grid{min-width:19rem}
  table.grid th,table.grid td{padding:.25rem .2rem;font-size:.78rem}
  table.grid td{letter-spacing:.12em}
}

/* ---------- printeris ----------
   Uz papīra lapa ir tā pati, kas Word failā: A4, Calibri izmēri punktos un
   viss vienā lapā. Tāpēc drukāt var arī tieši no pārlūka. */
@page{size:A4;margin:12mm 15mm}
@media print{
  .top,.tools{display:none}
  body{background:#fff;font-family:Calibri,var(--font);line-height:1.22}
  .sheet{margin:0;padding:0;max-width:none;box-shadow:none;border-radius:0}
  .sheet .meta{font-size:9pt;margin:0}
  .sheet .ph1{font-family:inherit;font-size:16pt;margin:0}
  .sheet .ph2{font-size:13pt;margin:0 0 3pt}
  .sheet .pnote{font-size:9.5pt;margin:0 0 4pt}
  .sheet .psec{font-size:10pt;margin:5pt 0 2pt}
  .sheet .pfoot{font-size:10pt;margin:4pt 0 0;color:#000}
  .form{margin:2pt 0 4pt;gap:.5rem}
  .form .line{height:14pt}
  .form .lbl{font-size:8pt}
  .box{margin:3pt 0 4pt;padding:4pt 6pt;border-radius:0}
  .box p{font-size:9pt}
  .box .boxt{font-size:8pt}
  .q{margin:0 0 2pt}
  .q .qt{font-size:10pt;margin:0}
  .q .opts{grid-template-columns:1fr 1fr;gap:0 .6rem;padding-left:.6rem}
  .q .opt{font-size:10pt;padding:0}
  .tw{overflow:visible;margin:2pt 0}
  table.grid th,table.grid td{font-size:10pt;padding:1pt 2pt}
  table.grid td{height:15pt;letter-spacing:.3em}
  .q,.box,.tw{break-inside:avoid}
}

/* ---------- vairākas lapas vienā skatā ---------- */
.sheet+.sheet{margin-top:1.4rem}
.sheet.atbl{display:none;border-top:4px solid var(--amber)}
.sheet.atbl.key{display:block}

/* ---------- pārbaudes darba uzdevumi ---------- */
.sheet .puzd{margin:1.1rem 0 .3rem;font-weight:600;color:var(--primary);
     font-size:1rem}
.sheet .puzd .pp{color:var(--amber-ink);font-weight:500;font-size:.85rem}
.sheet .ptext{margin:.2rem 0 .4rem;font-size:.95rem}

.rindas{margin:.3rem 0 .6rem;border:1px solid #A6A6A6;border-radius:.4rem;
     overflow:hidden}
.rindas p{margin:0;padding:.45rem .6rem;font-size:1rem;
     border-top:1px solid #A6A6A6}
.rindas p:first-child{border-top:0}

.jaut{margin:.2rem 0 .4rem;padding-left:.9rem}
.jaut p{margin:.1rem 0;font-size:.92rem}

/* Darba vieta ir rūtiņas - pirmklasnieks tajās zīmē figūras ar lineālu. */
.vieta{position:relative;margin:.3rem 0 .7rem;border:1px solid #A6A6A6;
     border-radius:.4rem;background-color:#fff;
     background-image:linear-gradient(#EEF2F8 1px,transparent 1px),
                      linear-gradient(90deg,#EEF2F8 1px,transparent 1px);
     background-size:.5cm .5cm;background-position:-1px -1px}
.vieta .vh{position:absolute;top:.2rem;left:.5rem;font-size:.72rem;
     color:var(--dim)}
table.grid td.vertr,table.grid tr.vertr td{height:1.6rem;letter-spacing:0}

.atbsar{margin:.1rem 0 .3rem;padding-left:.9rem}
.atbsar p{margin:.1rem 0;font-size:.9rem}

@media (max-width:768px){
  .sheet .puzd{font-size:.95rem}
  .rindas p{font-size:.95rem;padding:.4rem .5rem}
}

@media print{
  /* Katrs variants un katra lapa sākas ar jaunu A4 lapu. */
  .sheet+.sheet{break-before:page;margin-top:0}
  .sheet .puzd{font-size:11pt;margin:6pt 0 2pt}
  .sheet .ptext{font-size:10.5pt;margin:0 0 3pt}
  .rindas{margin:2pt 0 4pt;border-radius:0}
  .rindas p{font-size:11pt;padding:3pt 4pt}
  .jaut p{font-size:10pt;margin:0}
  .vieta{margin:2pt 0 4pt;border-radius:0}
  .vieta .vh{font-size:8pt}
  .atbsar p{font-size:10pt;margin:0}
  .rindas,.vieta,.jaut{break-inside:avoid}
}
</style>

    out.push({frac:[saknes(m[1]),saknes(m[2])]});
    last=DALA.lastIndex;
  }
  if(last<s.length)out=out.concat(saknes(s.slice(last)));
  return out;
}

function vienkarsi(s){
  /* Teksts bez marķējuma - platuma mērīšanai; daļa aizņem platāko rindu. */
  return String(s==null?"":s).replace(DALA,function(_,a,b){
    return a.length>=b.length?a:b;});
}

/* ------------------------------------------------------------- indeksi */
/* Kas ir indekss, izlemj mathfmt.py; te ir tikai tas pats noteikums
   JavaScriptā, ar tur doto izņēmumu sarakstu. */
var INDEKSI=false;
var FUNKCIJAS=["F(r)","F(x)","I(U)","T(r)","T(t)","U(I)","V(T)","V(p)","a(t)","d(x)","f(x)","g(h)","m(V)","p(T)","p(V)","s(t)","v(h)","v(r)","v(t)","x(l)","x(t)","y(x)"];         /* v(t), I(U) - grafiks, nevis indekss */
var PREFIKSI="ΔΠΣ∆∏∑";           /* ΣE(dienā): Σ nav simbola daļa */
var BURTS=/\p{L}/u;
var SATURS=/^[\p{L}\p{N}]{1,12}$/u;
var CIPARI=/^[0-9]+$/;
var ASCII=/^[0-9A-Za-z]$/;

function iekavuIndekss(s,i){
  /* "R(Z)": aizverošās iekavas vieta vai 0, ja tur nav indeksa. */
  var pirms=s.charAt(i-1),priekspirms,aizver,saturs;
  if(s.charAt(i)!=="("||i===0||!BURTS.test(pirms))return 0;
  if(i>1){
    priekspirms=s.charAt(i-2);
    if(PREFIKSI.indexOf(priekspirms)<0&&
       (BURTS.test(priekspirms)||ASCII.test(priekspirms)))return 0;
  }
  aizver=s.indexOf(")",i+1);
  if(aizver<0)return 0;
  saturs=s.slice(i+1,aizver);
  if(!SATURS.test(saturs)||CIPARI.test(saturs))return 0;
  return FUNKCIJAS.indexOf(pirms+"("+saturs+")")>=0?0:aizver;
}

function pasvitrasIndekss(s,i){
  /* "F_y" un "F_{max}": [indeksa sākums, gabala beigas] vai null. */
  var nak=s.charAt(i+1),aizver;
  if(s.charAt(i)!=="_"||i===0||pirmsIrAtstarpe(s,i))return null;
  if(nak==="{"){
    aizver=s.indexOf("}",i+2);
    if(aizver<0||!SATURS.test(s.slice(i+2,aizver)))return null;
    return [i+2,aizver,aizver+1];
  }
  if(!ASCII.test(nak)||ASCII.test(s.charAt(i+2)))return null;
  return [i+1,i+2,i+2];
}

function pirmsIrAtstarpe(s,i){var c=s.charAt(i-1);return c===" "||c==="	";}

function indeksi(s){
  /* Teksts -> atomi {text} un {sub}. Bez indeksiem - viens {text}. */
  s=String(s==null?"":s);
  if(!INDEKSI)return [{text:s}];
  var out=[],buf="",i=0,pas,aizver;
  function izliet(){if(buf){out.push({text:buf});buf="";}}
  while(i<s.length){
    pas=pasvitrasIndekss(s,i);
    if(pas){izliet();out.push({sub:s.slice(pas[0],pas[1])});i=pas[2];continue;}
    aizver=iekavuIndekss(s,i);
    if(aizver){izliet();out.push({sub:s.slice(i+1,aizver)});i=aizver+1;continue;}
    buf+=s.charAt(i);
    i++;
  }
  izliet();
  return out.length?out:[{text:""}];
}

return {atomi:atomi,saknes:saknes,vienkarsi:vienkarsi,indeksi:indeksi};
})();

window.IZLOZE=(function(){
"use strict";
/* Kodā nav līdzīgo zīmju (0/O, 1/I), lai to var nolasīt un pateikt balsī. */
var ZIMES="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function kods(garums){
  var n=garums||4,out="",i,a=new Uint32Array(n);
  if(window.crypto&&window.crypto.getRandomValues)
    window.crypto.getRandomValues(a);
  else for(i=0;i<n;i++)a[i]=Math.floor(Math.random()*4294967296);
  for(i=0;i<n;i++)out+=ZIMES[a[i]%ZIMES.length];
  return out;
}
function seja(s){
  var h=2166136261,i;
  for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function lozes(seed){
  return function(){
    seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function jauc(masivs,rnd){
  var i,j,t;
  for(i=masivs.length-1;i>0;i--){
    j=Math.floor(rnd()*(i+1));t=masivs[i];masivs[i]=masivs[j];masivs[j]=t;
  }
  return masivs;
}
function indeksi(n){
  var out=[],i;
  for(i=0;i<n;i++)out.push(i);
  return out;
}
function merki(n,rnd){
  /* Pareizajām atbildēm jāsadalās pa A-D vienmērīgi, lai atbilžu tabulā
     nesanāk virkne ar vienu burtu. */
  var out=[],i;
  for(i=0;i<n;i++)out.push(i%4);
  return jauc(out,rnd);
}
function sagatavo(jaut,merkis,rnd){
  var varianti=jaut[1].slice(),pareizais=jaut[2];
  var pari=varianti.map(function(v,i){return {v:v,ok:i===pareizais};});
  jauc(pari,rnd);
  var tag=pari.map(function(p){return p.ok;}).indexOf(true);
  var t=pari[tag];pari[tag]=pari[merkis];pari[merkis]=t;
  return {teksts:jaut[0],varianti:pari.map(function(p){return p.v;}),
          pareizais:merkis};
}

return {kods:kods,seja:seja,lozes:lozes,jauc:jauc,indeksi:indeksi,
        merki:merki,sagatavo:sagatavo};
})();

function variants(tests){
  /* Ja darbs top vairākos variantos (mat_page.py), tiem ir arī numurs. */
  return tests.nr?tests.nr+". variants  ·  kods "+tests.kods
                 :"variants "+tests.kods;
}

function blocks(dati,tests,atslega){
  var q=tests.jautajumi,n=q.length,out=[];
  out.push({t:"meta",text:metaRinda(dati)});
  out.push({t:"h1",text:dati.virsraksts+" Nr. "+dati.nr+".  "+dati.nosaukums});
  if(atslega){
    out.push({t:"h2",text:TEKSTI.skolotajam});
    out.push({t:"note",text:dati.apraksts+"  "+variants(tests)+
      ".  Izpildes laiks — "+dati.laiks+" minūtes, kopā "+n+
      " punkti (1 p. par katru pareizu atbildi)."});
    out.push({t:"grid",n:n,letters:tests.burti,atslega:true});
    out.push({t:"sec",text:TEKSTI.pareizas});
    out.push({t:"key",items:q.map(function(x,i){
      return {nr:i+1,letter:tests.burti[i],text:x.varianti[x.pareizais]};})});
    out.push({t:"sec",text:TEKSTI.parbauda});
    out.push({t:"tbl",widths:S.platumi.struktura,
      head:dati.aile||TEKSTI.strukturasGalva,
      rows:q.map(function(x,i){return [(i+1)+".",x.sr,x.stunda];})});
    out.push({t:"sec",text:TEKSTI.skala.replace("%d",n)});
    out.push({t:"skala",skala:dati.skala});
    return out;
  }
  out.push({t:"h2",text:n+" jautājumi  ·  "+dati.laiks+" minūtes  ·  "+n+
    " punkti  ·  "+variants(tests)});
  out.push({t:"note",text:dati.ievads});
  out.push({t:"form"});
  out.push({t:"box",title:TEKSTI.atgadne,lines:dati.atgadne});
  q.forEach(function(x,i){
    out.push({t:"q",nr:i+1,text:x.teksts,options:x.varianti,
              correct:x.pareizais});});
  out.push({t:"grid",n:n,letters:tests.burti,atslega:false});
  out.push({t:"foot",text:punkti(n)});
  return out;
}

/* ---------------------------------------------------------------- HTML */
function esc(s){return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function teksts(s){
  /* Teksts ar indeksiem: "s(kopā)" -> "s<sub>kopā</sub>". */
  return indeksi(s).map(function(r){
    return r.sub!=null?"<sub>"+esc(r.sub)+"</sub>":esc(r.text);}).join("");
}
function sakne(izteiksme){
  /* Zīme ir zīmēta (FD_STILS.sakne), tāpēc vinkuls turpinās no tās stūra
     un pāri paliek VISA izteiksme, ne tikai iekava. */
  var r=S.sakne;
  return '<span class="rt" style="--rw:'+r.w.toFixed(3)+'em">'+r.svg+
         '<span class="rv">'+teksts(izteiksme)+'</span></span>';
}
function atomi(list){
  return list.map(function(g){
    if(g.frac)return '<span class="f"><span class="n">'+atomi(g.frac[0])+
      '</span><span class="d">'+atomi(g.frac[1])+'</span></span>';
    if(g.root!=null)return sakne(g.root);
    return teksts(g.text);
  }).join("");
}
function mt(s){
  /* Teksts ekrānam: marķētās daļas un saknes top par īstām formulām. */
  return atomi(gabali(s));
}

var HTML={
  meta:function(b){return '<p class="meta">'+mt(b.text)+'</p>';},
  h1:function(b){return '<h2 class="ph1">'+mt(b.text)+'</h2>';},
  h2:function(b){return '<p class="ph2">'+mt(b.text)+'</p>';},
  note:function(b){return '<p class="pnote">'+mt(b.text)+'</p>';},
  sec:function(b){return '<p class="psec">'+mt(b.text)+'</p>';},
  foot:function(b){return '<p class="pfoot">'+mt(b.text)+'</p>';},
  form:function(){
    return '<div class="form">'+TEKSTI.veidlapa.map(function(x){
      return '<div><span class="line"></span><span class="lbl">'+esc(x)+
             '</span></div>';}).join("")+'</div>';},
  box:function(b){
    return '<div class="box"><p class="boxt">'+esc(b.title)+'</p>'+
      b.lines.map(function(x){return '<p>'+mt(x)+'</p>';}).join("")+'</div>';},
  q:function(b){
    return '<div class="q"><p class="qt"><b>'+b.nr+'.</b> '+mt(b.text)+
      '</p><div class="opts">'+b.options.map(function(o,i){
        return '<span class="opt'+(i===b.correct?" ok":"")+'"><b>'+B[i]+
               ')</b> '+mt(o)+'</span>';}).join("")+'</div></div>';},
  grid:function(b){
    var out='<p class="psec">'+esc(TEKSTI.tabula)+'</p>'+
            '<p class="pnote">'+esc(TEKSTI.pamaciba)+'</p>';
    bloki(b.n).forEach(function(g){
      var nr="",ab="",i;
      for(i=g.no;i<g.lidz;i++){
        nr+='<th>'+(i+1)+'.</th>';
        ab+='<td><span class="abcd">'+B.split("").join(" ")+
            '</span><span class="ans">'+b.letters[i]+'</span></td>';
      }
      for(i=g.lidz-g.no;i<S.ailes;i++){nr+='<th class="tuksa"></th>';
                                       ab+='<td></td>';}
      /* Tabulai ir sava rāmja josla: uz šaura telefona tā drīkst ritināties
         sāniski, bet lapa pati - ne. */
      out+='<div class="tw"><table class="grid"><tr class="nr">'+nr+
           '</tr><tr class="ab">'+ab+'</tr></table></div>';
    });
    return out;},
  key:function(b){
    return '<div class="keys">'+b.items.map(function(x){
      return '<p><b>'+x.nr+'. — '+x.letter+')</b> <span>'+mt(x.text)+
             '</span></p>';}).join("")+'</div>';},
  tbl:function(b){
    return '<table class="tbl"><tr>'+b.head.map(function(h){
      return '<th>'+esc(h)+'</th>';}).join("")+'</tr>'+
      b.rows.map(function(r){return '<tr>'+r.map(function(c){
        return '<td>'+mt(c)+'</td>';}).join("")+'</tr>';}).join("")+
      '</table>';},
  skala:function(b){
    var galva="",rinda="";
    b.skala.forEach(function(x){
      galva+='<th>'+x[0]+'</th>';
      rinda+='<td>'+(x[1]===x[2]?x[1]:x[1]+"–"+x[2])+'</td>';});
    return '<table class="grid"><tr class="nr">'+galva+'</tr><tr class="ab">'+
      rinda+'</tr></table><p class="pnote">'+esc(TEKSTI.skalasParaksts)+
      '</p>';}
};

function html(blocks){
  return blocks.map(function(b){
    return HTML[b.t]?HTML[b.t](b):"";}).join("\n");
}

/* ---------------------------------------------------------------- DOCX */
function punktoti(n){var s="",i;for(i=0;i<n;i++)s+=".";return s;}

/* Atbilžu varianti vienā rindā, ja ietilpst; citādi divās (kā at_common.py) */
function rindas(varianti){
  var apz=varianti.map(function(o,i){return B[i]+") "+o;});
  var visi=apz.join(ATSTARPE);
  return ietilpst(vienkarsi(visi),Z.jaut,S.platums-0.6)
    ? [visi] : [apz.slice(0,2).join(ATSTARPE),apz.slice(2).join(ATSTARPE)];
}
function ietilpst(teksts,izmers,platums){
  return teksts.length*izmers*0.47/28.35<=platums;
}

var DOCXR={
  meta:function(b){return [{parts:gabali(b.text),size:Z.meta,color:K.grey,
                            after:1}];},
  h1:function(b){return [{parts:gabali(b.text),size:Z.h1,bold:true,
                          color:K.navy,after:1}];},
  h2:function(b){return [{parts:gabali(b.text),size:Z.h2,bold:true,
                          color:K.navy,after:4}];},
  note:function(b){return [{parts:gabali(b.text),size:Z.note,italic:true,
                            color:K.grey,after:4}];},
  sec:function(b){return [{parts:gabali(b.text),size:Z.sec,bold:true,
                           color:K.navy,before:8,after:2}];},
  foot:function(b){return [{text:b.text,size:Z.jaut,before:4,after:0}];},
  form:function(){
    return [{t:"tbl",plain:true,widths:S.platumi.veidlapa,rows:[
      {cells:TEKSTI.veidlapa.map(function(){
        return {text:punktoti(32),size:11};})},
      {cells:TEKSTI.veidlapa.map(function(x){
        return {text:x,size:Z.mazs,color:K.grey};})}]},
      {text:"",size:2,after:2}];},
  box:function(b){
    return [{t:"tbl",widths:[S.platums],rows:[{cells:[{fill:K.box,
      paras:[{text:b.title,size:Z.mazs,bold:true,color:K.navy}].concat(
        b.lines.map(function(x){
          return {parts:gabali(x),size:Z.mazs};}))}]}]}];},
  q:function(b){
    var out=[{parts:gabali(b.nr+". "+b.text),size:Z.jaut,after:1}];
    var r=rindas(b.options);
    r.forEach(function(rinda,i){
      out.push({parts:gabali(rinda),size:Z.jaut,left:0.6,
                after:i===r.length-1?3:0});});
    return out;},
  grid:function(b){
    var out=[{text:b.atslega?TEKSTI.atslega:TEKSTI.tabula,size:Z.jaut,
              bold:true,color:K.navy,before:4,after:2}];
    if(!b.atslega)out.push({text:TEKSTI.pamaciba,size:Z.mazs,italic:true,
                            color:K.grey,after:3});
    var w=S.platums/S.ailes;
    bloki(b.n).forEach(function(g){
      var nr=[],ab=[],i;
      for(i=g.no;i<g.lidz;i++){
        nr.push({text:(i+1)+".",size:Z.jaut,bold:true,color:K.white,
                 fill:K.navy,align:"center"});
        ab.push({text:b.atslega?b.letters[i]:B.split("").join("     "),
                 size:12,bold:b.atslega,align:"center"});
      }
      out.push({t:"tbl",widths:Array(S.ailes).fill(w),
                rows:[{cells:nr},{cells:ab,height:0.70}]});
    });
    return out;},
  key:function(b){
    return b.items.map(function(x){
      return {left:0.4,after:0,parts:[
        {text:x.nr+". — "+x.letter+") ",size:Z.vid,bold:true}].concat(
        gabali(x.text).map(function(g){g.size=Z.jaut;g.color=K.grey;
                                       return g;}))};});},
  tbl:function(b){
    return [{t:"tbl",widths:b.widths,rows:[{cells:b.head.map(function(h){
      return {text:h,size:Z.note,bold:true,color:K.white,fill:K.navy};})}]
      .concat(b.rows.map(function(r){
        return {cells:r.map(function(c,i){
          return {parts:gabali(c),size:Z.jaut,bold:i===0,
                  color:i===0?K.navy:(i===2?K.grey:null)};})};}))}];},
  skala:function(b){
    var w=S.platums/b.skala.length;
    return [{t:"tbl",widths:Array(b.skala.length).fill(w),rows:[
      {cells:b.skala.map(function(x){
        return {text:String(x[0]),size:Z.jaut,bold:true,color:K.white,
                fill:K.navy,align:"center"};})},
      {cells:b.skala.map(function(x){
        return {text:x[1]===x[2]?String(x[1]):x[1]+"–"+x[2],size:Z.jaut,
                align:"center"};})}]},
      {text:TEKSTI.skalasParaksts,size:Z.mazs,italic:true,color:K.grey,
       before:2,after:0}];}
};

function docx(blocks){
  var out=[],i;
  for(i=0;i<blocks.length;i++){
    var f=DOCXR[blocks[i].t];
    if(f)out=out.concat(f(blocks[i]));
  }
  return out;
}

/* Bloku tipu tabulas un palīgi ir ārā, lai citi darbu veidi (piemēram,
   divu lapu pārbaudes darbs mat_paper.py) varētu likt klāt savus blokus,
   nepārrakstot jau uzrakstītos (DRY). */
return {blocks:blocks,html:html,docx:docx,gabali:gabali,
        vienkarsi:vienkarsi,HTML:HTML,DOCXR:DOCXR,TEKSTI:TEKSTI,
        bloki:bloki,esc:esc,mt:mt,punkti:punkti,rindas:rindas,
        metaRinda:metaRinda};
})();
</script>
<script>
window.PAPER_PD=(function(){
"use strict";
var P=window.PAPER,S=window.FD_STILS,K=S.krasas,Z=S.izmeri,B=S.burti;
var esc=P.esc,mt=P.mt,gabali=P.gabali;

var TEKSTI={
  uzdevums:"uzdevums",
  tests:"Tests",
  testaNorade:"Katram jautājumam ir viena pareizā atbilde. Apvelc pareizās "+
              "atbildes burtu!",
  turpinajums:"2. lapa",
  vertejums:"Vērtējums",
  vertejumaGalva:["Kopā","Balle"],
  maks:"Maksimālais punktu skaits par uzdevumu:  ",
  darbaVieta:"Risinājums un zīmējums",
  skolotajam:"Atbildes un vērtēšana — SKOLOTĀJAM",
  pareizas:"1. uzdevums. Tests — pareizās atbildes",
  parbauda:"Ko darbs pārbauda",
  skala:"Vērtēšanas skala (kopā %d punkti)",
  parbaudaGalva:["Uzd.","Pārbaudāmais sasniedzamais rezultāts","P."],
  punktuZime:" p."
};
var INDEKSI="abcdefgh";

function pk(n){return "("+n+TEKSTI.punktuZime+")";}

/* ------------------------------------------------------------- modelis */
function galvene(dati,darbs,apaks){
  return [{t:"meta",text:P.metaRinda(dati)},
          {t:"h1",text:dati.virsraksts+" Nr. "+dati.nr+".  "+dati.nosaukums},
          {t:"h2",text:apaks}];
}

/* Viena uzdevuma saturs. Uzbūve ir tā pati, ko lieto Word darba lapas
   (pd_common.py), tāpēc uzdevumu apraksts satura failā ir vienāds. */
function uzdevums(out,nr,u,punkti){
  out.push({t:"uzd",nr:nr,virs:u.virs,punkti:punkti});
  if(u.tips==="parveide"){
    if(u.note)out.push({t:"note",text:u.note});
    out.push({t:"rindas",items:u.rindas.map(function(r,i){
      return INDEKSI[i]+")   "+r[0];})});
  }else if(u.tips==="aprekins"){
    out.push({t:"para",text:u.teksts});
    out.push({t:"vieta",augstums:u.vieta,hint:u.hint||TEKSTI.darbaVieta});
  }else{
    out.push({t:"para",text:u.ievads});
    out.push({t:"jaut",items:u.jaut.map(function(j,i){
      return (i+1)+") "+j[0]+"  "+pk(j[1]);})});
    out.push({t:"vieta",augstums:u.vieta,hint:u.hint||TEKSTI.darbaVieta});
  }
}

function lapa(out,dati,darbs,nr){
  darbs.uzdevumi.forEach(function(x){
    if(x.lapa===nr)uzdevums(out,x.nr,x.u,x.punkti);
  });
}

function blocks(dati,darbs,atslega){
  var out=[],n=darbs.tests.length;
  if(atslega)return atbildes(dati,darbs);
  out=out.concat(galvene(dati,darbs,
    dati.kopa+" punkti  ·  "+dati.laiks+" minūtes  ·  variants "+
    darbs.kods));
  out.push({t:"note",text:dati.ievads});
  out.push({t:"form"});
  out.push({t:"box",title:P.TEKSTI.atgadne,lines:dati.atgadne});
  out.push({t:"uzd",nr:1,virs:TEKSTI.tests,punkti:n});
  out.push({t:"note",text:TEKSTI.testaNorade});
  darbs.tests.forEach(function(x,i){
    out.push({t:"q",nr:i+1,text:x.teksts,options:x.varianti,
              correct:x.pareizais});});
  lapa(out,dati,darbs,1);
  out.push({t:"pb"});
  out=out.concat(galvene(dati,darbs,
    TEKSTI.turpinajums+"  ·  variants "+darbs.kods));
  lapa(out,dati,darbs,2);
  out.push({t:"vert",punkti:[n].concat(darbs.uzdevumi.map(function(x){
    return x.punkti;}))});
  return out;
}

function atbildes(dati,darbs){
  var out=galvene(dati,darbs,TEKSTI.skolotajam),n=darbs.tests.length;
  out.push({t:"note",text:dati.apraksts+"  Variants "+darbs.kods+
    ".  Izpildes laiks — "+dati.laiks+" minūtes, kopā "+dati.kopa+
    " punkti."});
  out.push({t:"sec",text:TEKSTI.pareizas});
  out.push({t:"key",items:darbs.tests.map(function(x,i){
    return {nr:i+1,letter:darbs.burti[i],text:x.varianti[x.pareizais]};})});
  darbs.uzdevumi.forEach(function(x){
    out.push({t:"sec",text:x.nr+". "+TEKSTI.uzdevums+". "+x.u.virs+"  "+
      pk(x.punkti)});
    out.push({t:"saraksts",items:atbilzuRindas(x.u)});
  });
  out.push({t:"sec",text:TEKSTI.parbauda});
  out.push({t:"tbl",widths:S.platumi.struktura,head:TEKSTI.parbaudaGalva,
    rows:[["1.",darbs.tests.map(function(x){return x.sr;}).join("; "),
           String(n)]].concat(darbs.uzdevumi.map(function(x){
      return [x.nr+".",x.sr,String(x.punkti)];}))});
  out.push({t:"sec",text:TEKSTI.skala.replace("%d",dati.kopa)});
  out.push({t:"skala",skala:dati.skala});
  return out;
}

function atbilzuRindas(u){
  /* Pārveides uzdevumam atbilde ir katrai rindai, pārējiem - saraksts. */
  if(u.tips==="parveide")
    return u.rindas.map(function(r,i){
      return INDEKSI[i]+")  "+r[0]+"   →   "+r[1];});
  return u.atbildes||u.kriteriji||[];
}

/* ---------------------------------------------------------------- HTML */
function kopija(avots){
  var out={},k;
  for(k in avots)if(Object.prototype.hasOwnProperty.call(avots,k))
    out[k]=avots[k];
  return out;
}

var HTML=kopija(P.HTML);

HTML.uzd=function(b){
  return '<p class="puzd"><b>'+b.nr+'. '+esc(TEKSTI.uzdevums)+'.</b> '+
    mt(b.virs)+' <span class="pp">'+esc(pk(b.punkti))+'</span></p>';};
HTML.para=function(b){return '<p class="ptext">'+mt(b.text)+'</p>';};
HTML.rindas=function(b){
  return '<div class="rindas">'+b.items.map(function(x){
    return '<p>'+mt(x)+'</p>';}).join("")+'</div>';};
HTML.jaut=function(b){
  return '<div class="jaut">'+b.items.map(function(x){
    return '<p>'+mt(x)+'</p>';}).join("")+'</div>';};
HTML.vieta=function(b){
  return '<div class="vieta" style="min-height:'+b.augstums+'cm">'+
    '<span class="vh">'+esc(b.hint)+'</span></div>';};
HTML.vert=function(b){
  var galva="",rinda="",i;
  for(i=0;i<b.punkti.length;i++){
    galva+='<th>'+(i+1)+'. uzd.</th>';rinda+='<td></td>';}
  TEKSTI.vertejumaGalva.forEach(function(g){
    galva+='<th>'+esc(g)+'</th>';rinda+='<td></td>';});
  return '<p class="psec">'+esc(TEKSTI.vertejums)+'</p>'+
    '<div class="tw"><table class="grid"><tr class="nr">'+galva+
    '</tr><tr class="ab vertr">'+rinda+'</tr></table></div>'+
    '<p class="pnote">'+esc(TEKSTI.maks)+b.punkti.map(function(p,i){
      return (i+1)+". uzd. — "+p+TEKSTI.punktuZime;}).join("  ·  ")+'</p>';};
HTML.saraksts=function(b){
  return '<div class="atbsar">'+b.items.map(function(x){
    return '<p>'+mt(x)+'</p>';}).join("")+'</div>';};
HTML.pb=function(){return "";};

function html(blocks){
  return blocks.map(function(b){
    return HTML[b.t]?HTML[b.t](b):"";}).join("\n");
}

/* ---------------------------------------------------------------- DOCX */
var DOCXR=kopija(P.DOCXR);

DOCXR.uzd=function(b){
  return [{size:Z.sec,bold:true,color:K.navy,before:8,after:2,
           parts:[{text:b.nr+". "+TEKSTI.uzdevums+". "+b.virs+"   "+
                        pk(b.punkti)}]}];};
DOCXR.para=function(b){
  return [{parts:gabali(b.text),size:11,after:3}];};
DOCXR.rindas=function(b){
  return [{t:"tbl",widths:[S.platums],rows:b.items.map(function(x){
    return {height:0.85,cells:[{parts:gabali(x),size:11}]};})}];};
DOCXR.jaut=function(b){
  return b.items.map(function(x,i){
    return {parts:gabali(x),size:Z.jaut,left:0.4,
            after:i===b.items.length-1?3:1};});};
DOCXR.vieta=function(b){
  return [{t:"tbl",widths:[S.platums],rows:[{height:b.augstums,
    cells:[{text:b.hint,size:Z.mazs,color:K.grey}]}]}];};
DOCXR.vert=function(b){
  var galva=[],rinda=[],i,n=b.punkti.length+TEKSTI.vertejumaGalva.length;
  var w=S.platums/n;
  for(i=0;i<b.punkti.length;i++){
    galva.push({text:(i+1)+". uzd.",size:Z.mazs,bold:true,color:K.white,
                fill:K.navy,align:"center"});
    rinda.push({text:"",size:11});}
  TEKSTI.vertejumaGalva.forEach(function(g){
    galva.push({text:g,size:Z.mazs,bold:true,color:K.white,fill:K.navy,
                align:"center"});
    rinda.push({text:"",size:11});});
  return [{t:"tbl",widths:Array(n).fill(w),
           rows:[{cells:galva},{cells:rinda,height:1.0}]},
          {text:TEKSTI.maks+b.punkti.map(function(p,i){
             return (i+1)+". uzd. — "+p+TEKSTI.punktuZime;}).join("  ·  "),
           size:Z.mazs,color:K.grey,before:2,after:0}];};
DOCXR.saraksts=function(b){
  return b.items.map(function(x){
    return {parts:gabali(x),size:Z.jaut,left:0.4,after:1};});};
DOCXR.pb=function(){return [{t:"pb"}];};

function docx(blocks){
  var out=[],i;
  for(i=0;i<blocks.length;i++){
    var f=DOCXR[blocks[i].t];
    if(f)out=out.concat(f(blocks[i]));
  }
  return out;
}

return {blocks:blocks,html:html,docx:docx};
})();
</script>
<script>
(function(){
"use strict";
var D=window.MAT_DATI,S=window.FD_STILS,I=window.IZLOZE;
var MOD=D.veids==="pd"?window.PAPER_PD:window.PAPER;
var KODA_GARUMS=5;

/* ------------------------------------------------------------- izloze */
function darbs(kod){
  /* Viens darbs: no katras jautājumu grupas viens jautājums un katram
     uzdevumam viens tā variants. Ar to pašu kodu vienmēr sanāk tas pats. */
  var rnd=I.lozes(I.seja(kod)),grupas=D.veids==="pd"?D.tests:D.grupas;
  var m=I.merki(grupas.length,rnd);
  var q=grupas.map(function(g,i){
    var izvele=g.jautajumi[Math.floor(rnd()*g.jautajumi.length)];
    var x=I.sagatavo(izvele,m[i],rnd);
    x.sr=g.sr;x.stunda=g.stunda;
    return x;});
  var d={kods:kod,burti:q.map(function(x){return S.burti[x.pareizais];})};
  if(D.veids==="pd"){
    d.tests=q;
    d.uzdevumi=D.uzdevumi.map(function(u,i){
      return {nr:i+2,sr:u.sr,punkti:u.punkti,lapa:u.lapa,
              u:u.varianti[Math.floor(rnd()*u.varianti.length)]};});
  }else{
    d.jautajumi=q;
  }
  return d;
}

/* --------------------------------------------------------- attēlošana */
var laukums=document.getElementById("darbs"),
    kodsEl=document.getElementById("kods"),
    poga=document.getElementById("atb"),
    tagad=null;

function lapas(bloki){
  /* Bloku saraksts -> lapas; {t:"pb"} sāk jaunu lapu. */
  var out=[[]],i;
  for(i=0;i<bloki.length;i++){
    if(bloki[i].t==="pb")out.push([]);
    else out[out.length-1].push(bloki[i]);
  }
  return out;
}
function lapa(bloki,klase){
  return '<div class="sheet'+(klase?" "+klase:"")+'">'+MOD.html(bloki)+
         '</div>';
}
function zime(d){
  tagad=d;
  var teksts="";
  lapas(MOD.blocks(D,d,false)).forEach(function(l){teksts+=lapa(l);});
  /* Atbildes ir klāt vienmēr, tikai apslēptas - poga tās tikai parāda. */
  lapas(MOD.blocks(D,d,true)).forEach(function(l){teksts+=lapa(l,"atbl");});
  laukums.innerHTML=teksts;
  atslega(false);
  kodsEl.innerHTML="Variants <b>"+d.kods+"</b>";
  if(location.hash.slice(1)!==d.kods)
    history.replaceState(null,"","#"+d.kods);
}
function atslega(on){
  var lapas=laukums.getElementsByClassName("sheet"),i;
  for(i=0;i<lapas.length;i++)
    lapas[i].classList[on?"add":"remove"]("key");
  poga.setAttribute("aria-pressed",on?"true":"false");
}
function lejup(atsl){
  var bloki=MOD.docx(MOD.blocks(D,tagad,atsl));
  window.DOCX.save(window.DOCX.build(bloki),
    D.fails+" ("+(atsl?"atbildes, ":"")+"variants "+tagad.kods+").docx");
}

document.getElementById("jauns").addEventListener("click",function(){
  zime(darbs(I.kods(KODA_GARUMS)));
  window.scrollTo({top:0,behavior:"smooth"});
});
poga.addEventListener("click",function(){
  atslega(poga.getAttribute("aria-pressed")!=="true");});
document.getElementById("word").addEventListener("click",function(){
  lejup(false);});
document.getElementById("wordatb").addEventListener("click",function(){
  lejup(true);});
document.getElementById("druka").addEventListener("click",function(){
  window.print();});

var sakums=location.hash.slice(1).toUpperCase();
zime(darbs(/^[A-Z0-9]{5}$/.test(sakums)?sakums:I.kods(KODA_GARUMS)));
})();
</script>
</body>
</html>
